{% extends "base.html" %}

{% block title %}Registrarse{% endblock %}

{% block content %}
<h1>Crear cuenta</h1>
<form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrarme</button>
</form>
<p>¿Ya tenés cuenta? <a href="{% url 'cuentas:login' %}">Ingresá</a></p>
{% endblock %}
