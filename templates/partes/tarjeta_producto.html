{# Requiere la variable p (un Producto). #}
<article class="tarjeta">
    <a class="tarjeta-imagen" href="{% url 'catalogo:detalle' p.pk %}">
        {% if p.imagen %}
        <img src="{{ p.imagen.url }}" alt="{{ p.nombre }}" loading="lazy">
        {% else %}
        <span class="sin-imagen">{% include "partes/icono.html" with nombre="imagen" %}</span>
        {% endif %}
    </a>
    <div class="tarjeta-cuerpo">
        <h3><a href="{% url 'catalogo:detalle' p.pk %}">{{ p.nombre }}</a></h3>
        <p class="texto-suave">{{ p.marca }} · {{ p.categoria }}</p>
        <p class="precio">${{ p.precio }}</p>
        <div class="tarjeta-accion">
            {% if p.stock > 0 %}
            <form method="post" action="{% url 'pedidos:agregar' p.pk %}">
                {% csrf_token %}
                <input type="hidden" name="cantidad" value="1">
                <input type="hidden" name="next" value="{{ request.get_full_path }}">
                <button class="boton boton-bloque" type="submit">
                    {% include "partes/icono.html" with nombre="carrito" %} Añadir al carrito
                </button>
            </form>
            {% else %}
            <button class="boton boton-bloque" type="button" disabled>Sin stock</button>
            {% endif %}
        </div>
    </div>
</article>
