{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Zairux · indumentaria femenina </title>
    <meta name="description"
        content="{% block description %}{{ negocio.nombre }} {{ negocio.lema|lower }}: {{ negocio.rubro|lower }} en {{ negocio.ciudad}}.{% endblock %}">
    <link rel="icon" href="{% static 'img/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}?v=9.9">
    <script src="{% static 'js/sitio.js' %}" defer></script>
</head>

<body>
    {% include "partes/cabecera.html" %}

    <main class="contenedor">
        {% if messages %}
        <ul class="mensajes">
            {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% include "partes/pie.html" %}

    <dialog class="modal" data-modal aria-label="Vista rápida del producto">
        <button type="button" class="modal-cerrar" data-modal-cerrar aria-label="Cerrar">
            {% include "partes/icono.html" with nombre="cerrar" %}</button>
        <div class="modal-cuerpo" data-modal-contenido></div>
    </dialog>

    <a class="whatsapp-flotante" href="{{ whatsapp_url }}" target="_blank" rel="noopener"
        aria-label="Escribinos por WhatsApp">
        {% include "partes/icono.html" with nombre="whatsapp" %}
    </a>
</body>

</html>
